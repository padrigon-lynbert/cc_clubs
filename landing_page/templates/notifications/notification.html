<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notification</title>
</head>
<body>
    {% for detail in application %}
        <h1>{{ detail.club_name }} Club</h1>
        <h2>{{ detail.acronym }}</h2>
        <p>{{ detail.description }}</p>
        {% if detail.rejection_message %}
            <p>Remarks: {{ detail.rejection_message }}</p>
        {% else %}
            <p>Remarks: No Remarks</p>
        {% endif %}
        <div>Status: {{ detail.get_status_display }}</div>
        <div></div>
    {% endfor %}

    <a href="{% url 'home' %}">Back</a>
</body>
</html>
