{% for club in clubs %}
<tr class="club-row" 
    data-id="{{ club.id }}"
    data-name="{{ club.club_name }}" 
    data-description="{{ club.description|default:'No description yet.' }}">
    <td>{{ club.acronym }}</td>
    <td>{{ club.location }}</td>
    <td>Yes</td>
    <td>No</td>
</tr>
{% endfor %}
