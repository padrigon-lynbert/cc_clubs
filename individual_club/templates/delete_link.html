<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Link</title>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 40px;
            color: #333;
        }

        .container {
            max-width: 520px;
            margin: auto;
        }

        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
        }

        h1 {
            margin-bottom: 10px;
            font-size: 24px;
            font-weight: 600;
            text-align: center;
            color: #b91c1c;
        }

        .warning {
            text-align: center;
            margin-bottom: 25px;
            color: #555;
            font-size: 14px;
        }

        .details {
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 30px;
        }

        .details-row {
            display: flex;
            padding: 12px 14px;
            font-size: 14px;
        }

        .details-row:not(:last-child) {
            border-bottom: 1px solid #e5e7eb;
        }

        .details-label {
            width: 90px;
            font-weight: 500;
            color: #374151;
        }

        .details-value {
            color: #111827;
            word-break: break-all;
        }

        .actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .btn {
            padding: 10px 18px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-danger {
            background-color: #dc2626;
            color: white;
        }

        .btn-danger:hover {
            background-color: #b91c1c;
        }

        .btn-secondary {
            background-color: #e5e7eb;
            color: #374151;
        }

        .btn-secondary:hover {
            background-color: #d1d5db;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <h1>Delete Link</h1>

            <p class="warning">
                This action cannot be undone. Are you sure you want to delete this link?
            </p>

            <div class="details">
                <div class="details-row">
                    <div class="details-label">Platform</div>
                    <div class="details-value">{{ link.get_platform_display }}</div>
                </div>
                <div class="details-row">
                    <div class="details-label">URL</div>
                    <div class="details-value">{{ link.url }}</div>
                </div>
            </div>

            <form method="post">
                {% csrf_token %}
                <div class="actions">
                    <a href="{% url 'display_link' club_id %}" class="btn btn-secondary">
                        Cancel
                    </a>
                    <button type="submit" class="btn btn-danger">
                        Confirm Delete
                    </button>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
