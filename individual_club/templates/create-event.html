<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Create Event - BCP Club System</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff;
      color: #333;
    }
    header {
      background: #243B6B;
      color: white;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      font-weight: bold;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    nav a {
      color: white;
      text-decoration: none;
      margin: 0 1rem;
      font-weight: 500;
    }
    nav a.events {
      color: #FFD700;
      font-weight: 700;
    }
    .login-btn {
      border: 2px solid #FFD700;
      padding: 0.5rem 1rem;
      border-radius: 20px;
      color: #FFD700;
      background: transparent;
      cursor: pointer;
      font-weight: 600;
      text-decoration: none;
    }
    
    main {
      max-width: 600px;
      margin: 3rem auto;
      padding: 0 1rem;
      text-align: center;
    }
    main h1 {
      color: #FFD700;
      font-size: 2.5rem;
      margin-bottom: 0.3rem;
    }
    main p.subtitle {
      color: #333;
      margin-bottom: 2rem;
      font-weight: 400;
    }

    form {
      background: #FFF9E5;
      padding: 2rem;
      border-radius: 15px;
      box-shadow: 0 0 10px rgb(0 0 0 / 0.1);
      text-align: left;
    }
    label {
      display: block;
      margin-bottom: 0.3rem;
      font-weight: 600;
      color: #333;
    }
    input, textarea, select {
      width: 100%;
      padding: 0.75rem;
      margin-bottom: 1.5rem;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 1rem;
      font-family: inherit;
    }
    textarea {
      resize: vertical;
    }
    button {
      background: #FFD700;
      color: #243B6B;
      padding: 0.8rem 2rem;
      font-weight: 700;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      font-size: 1.1rem;
      display: block;
      margin: 0 auto;
      transition: background 0.3s ease;
    }
    button:hover {
      background: #e6c200;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <img src="logo.png" alt="BCP Logo" style="width:30px; height:30px;">
    <span>BCP CLUB SYSTEM</span>
  </div>
  <nav>
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Clubs</a>
    <a href="#">Members</a>
    <a href="#" class="events">Events</a>
  </nav>
  <a href="#" class="login-btn">Member Login</a>
</header>

<main>
  <h1>Create Event</h1>
  <p class="subtitle">Fill in the details to organize a new club event</p>

  <form>
    <label for="eventName">Event Name</label>
    <input type="text" id="eventName" name="eventName" required />

    <label for="eventDate">Event Date</label>
    <input type="date" id="eventDate" name="eventDate" required />

    <label for="eventTime">Event Time</label>
    <input type="time" id="eventTime" name="eventTime" required />

    <label for="location">Location</label>
    <input type="text" id="location" name="location" required />

    <label for="description">Description</label>
    <textarea id="description" name="description" rows="4" required></textarea>

    <label for="organizer">Organizer</label>
    <input type="text" id="organizer" name="organizer" />

    <button type="submit">Create Event</button>
  </form>
</main>

</body>
</html>
